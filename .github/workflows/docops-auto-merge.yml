name: DocOps auto-merge
# Auto-merges the mechanical DocOps PRs a human currently rubber-stamps.
#
# One job per automation (see .github/scripts/docops_automations.py):
#   version-snippet         the stable/beta version numbers  (live since DOC-2269)
#   reusable-content-index  REUSABLE_CONTENT_INDEX.md        (DOC-2459)
#   space-index             SPACE_INDEX.md                   (DOC-2461)
#
# Each acts ONLY on PRs carrying its own body marker
# (<!-- docops:automation=<name> -->), written by the n8n flow that opens the PR.
# Every other PR is ignored, so an automation stays dormant until its flow opts in
# and there is never a flag day.
#
# It never merges via admin bypass. It approves and enables GitHub's NATIVE
# auto-merge as the n8n-assistant GitHub App (not github-actions[bot]), so the
# repo ruleset (1 approval + required checks + branch up to date) still gates
# every merge; GitHub performs the merge itself once those are satisfied. The
# async merge is reported back by the merged-sweep.
#
# Security: every trigger fires the workflow from the DEFAULT branch (there is
# deliberately no `pull_request` trigger, which would run the PR-head copy of this
# file/scripts). Checkout is pinned to `main`; PR file contents are pulled through
# the API as data; each verdict is a pure imported function. Actions are SHA-pinned.
on:
  check_suite:
    types: [completed]
  push:
    branches: [main]          # drives update-branch (strict ruleset) + merged-sweep
  schedule:
    - cron: "*/15 * * * *"    # backstop sweep
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate (blank = sweep open PRs)
        required: false
      flow:
        description: Which automation to run (blank = all)
        required: false
        type: choice
        default: ""
        options:
          - ""
          - version-snippet
          - reusable-content-index
          - space-index

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one automation escalating must not cancel the others
      matrix:
        flow:
          - version-snippet
          - reusable-content-index
          - space-index
    # Per-automation group: sweeps of different flows must not serialise behind
    # each other, but two sweeps of the SAME flow still must.
    concurrency:
      group: docops-auto-merge-${{ matrix.flow }}
      cancel-in-progress: false
    steps:
      # Approve/merge must act as the App, not github-actions[bot] (per DevX review).
      # Same identity + secrets the CLA workflow (ci-cla-check.yml) already uses.
      - name: Generate n8n-assistant App token
        if: github.event.inputs.flow == '' || github.event.inputs.flow == matrix.flow
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}

      # Trusted code: pin to main so we never run a PR-head copy of the scripts.
      - name: Checkout main (trusted)
        if: github.event.inputs.flow == '' || github.event.inputs.flow == matrix.flow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      # Only the dispatched automation runs when one is named; otherwise all of them.
      # The filter lives at STEP level on purpose: the `matrix` context is not
      # available in a job-level `if`, which is evaluated before the matrix is
      # applied, so a job-level guard here would silently skip every leg.
      - name: Evaluate and act
        if: github.event.inputs.flow == '' || github.event.inputs.flow == matrix.flow
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          FLOW: ${{ matrix.flow }}
          INPUT_PR: ${{ github.event.inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK_URL: ${{ secrets.DOCOPS_AUTOMERGE_WEBHOOK_URL }}
          WEBHOOK_USER: ${{ secrets.WEBHOOK_USER }}
          WEBHOOK_PASSWORD: ${{ secrets.WEBHOOK_PASSWORD }}
          # Marker, branch pattern, files and verdict live in the profile. Only the
          # two deployment-specific values are overridable here, and both currently
          # match the profile defaults.
          ALLOWED_AUTHORS: "its-imad"          # phase 2 may add a dedicated author bot
          REQUIRED_CHECKS: "runner / vale,link-check,cubic · AI code reviewer,CLA Check"
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PR:-}" ]; then
            python3 .github/scripts/docops_auto_merge.py --flow "$FLOW" --pr "$INPUT_PR"
          else
            python3 .github/scripts/docops_auto_merge.py --flow "$FLOW"
          fi
