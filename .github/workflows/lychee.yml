name: Lychee external linkcheck
# Weekly sweep of every external link under docs/. The JSON report is POSTed to the
# DocOps n8n webhook (secret DOCOPS_LYCHEE_WEBHOOK_URL), which alerts Slack, adds a dated
# tab to the "DocOps - Outbound Links" Google Sheet and stores the rows in Supabase.
# Broken links do not fail this job: the job is red only if lychee itself crashed or the
# report could not be delivered (DOC-2307).
#
# Two passes since DOC-2396. lychee judges a link by its status code, which misses a link
# that only works because the vendor still redirects it, and one whose replacement page
# answers 200 while saying "not found". link_second_pass.py covers both and its findings
# ride along in the same payload.
on:
  schedule:
    - cron: "18 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Lychee Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@a99389aeff3c193ffb6f0741178e519569d3f404 # v2.3.0
        with:
          # --hidden: without it lychee's directory walk skips dot-directories, which
          # silently dropped the 116 files in docs/reusable-content/.gitbook/includes
          # holding 70 URLs that appear nowhere else. They render on live pages via
          # {% include %}, so they were live links no checker had ever seen (DOC-2396).
          args: --config lychee.toml --hidden ./docs
          format: json
          output: lychee/out.json
          fail: false
          failIfEmpty: false
          jobSummary: false

      - name: Second pass for soft 404s and redirect-reliant links
        if: always()
        # Never blocks the report: the script always exits 0, and this guard covers a
        # crash too. The lychee findings are the deliverable; this pass is an add-on.
        continue-on-error: true
        env:
          OUTPUT: lychee/quality.json
        run: python3 .github/scripts/link_second_pass.py

      - name: Send report to n8n
        if: always()
        env:
          REPORT: lychee/out.json
          QUALITY_REPORT: lychee/quality.json
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK_URL: ${{ secrets.DOCOPS_LYCHEE_WEBHOOK_URL }}
          WEBHOOK_USER: ${{ secrets.WEBHOOK_USER }}
          WEBHOOK_PASSWORD: ${{ secrets.WEBHOOK_PASSWORD }}
        run: python3 .github/scripts/lychee_report.py
