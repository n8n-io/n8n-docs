name: Script tests
# Runs the network-free unit tests for .github/scripts helpers.
on:
  pull_request:
    paths:
      - .github/scripts/**
      - .github/workflows/script-tests.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitbook-preview-links:
    name: runner / gitbook-preview-links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run gitbook_preview_links tests
        run: python3 .github/scripts/tests/test_gitbook_preview_links.py

  check-internal-links:
    name: runner / check-internal-links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run check_internal_links tests
        run: python3 .github/scripts/tests/test_check_internal_links.py

  check-version-snippet:
    name: runner / check-version-snippet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run check_version_snippet_pr tests
        run: python3 .github/scripts/tests/test_check_version_snippet_pr.py
      - name: Run docops_auto_merge tests
        run: python3 .github/scripts/tests/test_docops_auto_merge.py
