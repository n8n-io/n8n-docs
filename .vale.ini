StylesPath = "styles"
MinAlertLevel = warning
Vocab = default
[*.md]
BasedOnStyles = from-write-good, n8n-styles, from-microsoft, Vale
Vale.Terms = NO
from-alex.Profanity = NO
from-microsoft.Quotes = NO
TokenIgnores = (\-\-8\<\-\- \".*\"), (-only), (\*\*.*\*\*), (\*\*Release date:\*\*.*), (\[\[\%.*\%\]\]), (\[\[.*\]\]), (Rocket\.Chat), (\(https.*\)), (\{%.*?%\}), (Get Many), (US Government),

# Changelog pages use "vX.Y" as intentional shorthand in page titles and headings,
# and reference many external service/API versions. Don't lint n8n version format there.
[docs/changelog/**]
n8n-styles.version-format = NO

# The style guide documents this rule, so it contains counter-examples on purpose.
[docs/contribute/style-guide-for-n8n-docs.md]
n8n-styles.version-format = NO
n8n-styles.terminology = NO
n8n-styles.terminology-casing = NO

# The terminology word list is intentionally full of the non-official terms and
# casings it tells authors to avoid, so disable the terminology and spelling checks here.
[docs/contribute/terminology.md]
n8n-styles.terminology = NO
n8n-styles.terminology-casing = NO
Vale.Spelling = NO
Vale.Avoid = NO

# Workflow SDK reference and best-practice pages are generated from the
# @n8n/workflow-sdk package by the "Workflow SDK docs generator" workflow on
# docs-prod (DOC-2311). The text is the parser's own reference and is kept
# verbatim so it matches what validate_workflow accepts. Don't style-lint it.
[docs/connect/workflow-sdk/reference/**]
BasedOnStyles =

[docs/connect/workflow-sdk/best-practices/**]
BasedOnStyles =
